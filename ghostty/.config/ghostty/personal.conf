# Personal Ghostty settings, included last from ~/.config/ghostty/config
# (link.py manages that one include line), so these override the theme.

# Make the focused split obvious, iTerm-style: wash inactive splits with a
# neutral gray instead of the default background-colored overlay, which is
# nearly invisible on dark themes. Mid-gray reads on light themes too.
unfocused-split-fill = #808080
# 1 = no dimming; 0.82 means an 18% overlay.
unfocused-split-opacity = 0.82
# A divider a little brighter than the dimmed panes.
split-divider-color = #6b7089
